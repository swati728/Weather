# AndroidX is required -- without this the build can't resolve androidx.* artifacts.
android.useAndroidX=true

# Recommended default: Jetifier off since this project only uses AndroidX deps directly.
android.enableJetifier=false

# Kotlin code style used by Android Studio's built-in formatter.
kotlin.code.style=official

# JVM args for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Speeds up multi-module builds (harmless here with a single module).
org.gradle.parallel=true

# Use AndroidX-compatible non-transitive R classes (Android Studio default since AGP 8).
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
